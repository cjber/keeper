name: Feature
description: Suggest a scanner or a change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is left behind or hard to do today.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: What must block it
      description: The cases where keeper has to leave this alone.
